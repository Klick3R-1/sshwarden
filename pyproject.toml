[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sshwarden"
version = "0.1.0"
description = "SSH key management dashboard backed by Bitwarden"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
sshwarden      = "sshwarden.main:run"
sshwarden-sync = "sshwarden.sync:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sshwarden = ["templates/**/*.html"]
