[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sshkey-ui"
version = "0.1.0"
description = "SSH key management dashboard backed by Bitwarden"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
sshkey-ui   = "sshkey_ui.main:run"
sshkey-sync = "sshkey_ui.sync:main"

[tool.setuptools.packages.find]
where = ["src"]
