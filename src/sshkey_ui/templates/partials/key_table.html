<div id="key-table">
  {% if not rows %}
  <p>No SSH key items found in Bitwarden.</p>
  {% else %}
  <figure>
  <table role="grid">
    <thead>
      <tr>
        <th>Alias</th>
        <th>User</th>
        <th>Host</th>
        <th>Port</th>
        <th>Fingerprint</th>
        <th>Age</th>
        <th>Agent</th>
        <th>Password</th>
        <th>Deployed</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
        {% set item = row.item %}
        {% set agent = row.agent %}
        {% set dep_status = row.dep_status %}
        {% set has_local_key = row.has_local_key %}
        {% include "partials/key_row.html" %}
      {% endfor %}
    </tbody>
  </table>
  </figure>
  {% endif %}
</div>
