<p style="font-size:.8rem; color:#888; margin-bottom:.75rem">
  <kbd>{{ item_name }}</kbd>
  — protected fields (alias, user, hostname, port, password) are managed via Migrate.
</p>

{% if error %}
<p style="color:#f77; font-size:.82rem; font-family:monospace">{{ error }}</p>
{% endif %}

<form hx-post="/keys/{{ item_id }}/fields"
      hx-target="#fields-dialog-body"
      hx-swap="innerHTML">

  <div id="custom-fields-list">
    {% for f in custom_fields %}
    <div class="field-row" style="display:grid; grid-template-columns:1fr 1fr auto auto; gap:.4rem; margin-bottom:.35rem; align-items:center">
      <input name="field_name" value="{{ f.name }}" placeholder="Name" style="font-size:.82rem">
      {% if f.type == 1 %}
      <input name="field_value" type="password" value="{{ f.value }}" placeholder="Value" style="font-size:.82rem">
      {% else %}
      <input name="field_value" value="{{ f.value }}" placeholder="Value" style="font-size:.82rem">
      {% endif %}
      <select name="field_type" style="font-size:.82rem; width:6rem">
        <option value="0"{% if f.type == 0 %} selected{% endif %}>text</option>
        <option value="1"{% if f.type == 1 %} selected{% endif %}>hidden</option>
      </select>
      <button type="button" class="outline secondary"
              style="padding:.15rem .45rem; font-size:.8rem; color:#c44"
              onclick="this.closest('.field-row').remove()">✕</button>
    </div>
    {% endfor %}
  </div>

  <button type="button" class="outline secondary"
          style="font-size:.8rem; margin-bottom:.75rem"
          onclick="addFieldRow()">+ Add field</button>

  <footer style="margin-top:.5rem">
    <button type="submit">Save</button>
    <button type="button" class="outline secondary"
            onclick="document.getElementById('fields-dialog').close()">Cancel</button>
  </footer>
</form>

<script>
function addFieldRow() {
  const list = document.getElementById('custom-fields-list');
  const div = document.createElement('div');
  div.className = 'field-row';
  div.style.cssText = 'display:grid; grid-template-columns:1fr 1fr auto auto; gap:.4rem; margin-bottom:.35rem; align-items:center';
  div.innerHTML = `
    <input name="field_name" placeholder="Name" style="font-size:.82rem">
    <input name="field_value" placeholder="Value" style="font-size:.82rem">
    <select name="field_type" style="font-size:.82rem; width:6rem">
      <option value="0">text</option>
      <option value="1">hidden</option>
    </select>
    <button type="button" class="outline secondary"
            style="padding:.15rem .45rem; font-size:.8rem; color:#c44"
            onclick="this.closest('.field-row').remove()">✕</button>
  `;
  list.appendChild(div);
}
</script>
