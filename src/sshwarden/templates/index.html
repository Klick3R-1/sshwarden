{% extends "base.html" %}
{% block title %}Dashboard — SSH Key Manager{% endblock %}
{% block content %}

<div style="display:flex; align-items:center; gap:.6rem; margin-bottom:.75rem; flex-wrap:wrap">
  <h3 style="margin:0">SSH Keys</h3>
  <button hx-post="/sync"
          hx-target="#sync-log"
          hx-swap="innerHTML"
          hx-indicator="#sync-spinner"
          class="outline">
    Sync
    <span id="sync-spinner" class="htmx-indicator"> ⏳</span>
  </button>
<button hx-post="/clear"
          hx-target="#sync-log"
          hx-swap="innerHTML"
          hx-indicator="#clear-spinner"
          hx-confirm="Remove all files in ~/.ssh/sshwarden/ and delete sshwarden.auto.conf?"
          class="outline secondary" style="color:#c66">
    Clear
    <span id="clear-spinner" class="htmx-indicator"> ⏳</span>
  </button>
  <button onclick="document.getElementById('new-key-dialog').showModal()" class="outline contrast">
    + New key
  </button>
  <label style="margin:0; display:flex; align-items:center; gap:.4rem; font-size:.9em; cursor:pointer">
    <input type="checkbox" id="show-shared" role="switch"
           onchange="reloadKeys()" style="margin:0">
    Show shared
  </label>
</div>

<div id="sync-log"></div>

<div hx-get="/keys" hx-trigger="load" hx-swap="outerHTML" id="key-table-wrapper">
  <p aria-busy="true">Loading keys…</p>
</div>

<script>
function reloadKeys() {
  const shared = document.getElementById('show-shared').checked;
  htmx.ajax('GET', '/keys?show_shared=' + shared, {target: '#key-table', swap: 'outerHTML'});
}
function togglePub(id, btn) {
  const el = document.getElementById('pub-' + id);
  const shown = el.dataset.shown === '1';
  el.textContent = shown ? '••••••' : el.dataset.pub;
  el.dataset.shown = shown ? '0' : '1';
  btn.textContent = shown ? 'show' : 'hide';
}
function copyPub(id, btn) {
  const el = document.getElementById('pub-' + id);
  navigator.clipboard.writeText(el.dataset.pub).then(() => {
    const prev = btn.textContent;
    btn.textContent = 'copied';
    setTimeout(() => { btn.textContent = prev; }, 1200);
  });
}
</script>

<!-- New key modal -->
<dialog id="new-key-dialog">
  <article>
    <header>
      <button aria-label="Close" rel="prev" onclick="document.getElementById('new-key-dialog').close()"></button>
      <h3>New SSH Key</h3>
    </header>
    <form method="post" action="/keys/create">
      <div class="grid">
        <label>Alias <input name="alias" placeholder="myserver" required></label>
        <label>User  <input name="user"  placeholder="root" required></label>
      </div>
      <div class="grid">
        <label>Hostname <input name="hostname" placeholder="10.0.0.1 or server.example.com"></label>
        <label>Port     <input name="port" value="22" style="width:6rem"></label>
      </div>
      <label>Password (optional) <input type="password" name="password"></label>
      <label>Key type
        <select name="key_type">
          <option value="ed25519" selected>ed25519 (recommended)</option>
          <option value="rsa" >rsa 4096</option>
        </select>
      </label>
      <small>⚠ Private key touches disk briefly during creation.</small>
      <footer>
        <button type="submit">Create</button>
        <button type="button" class="outline secondary"
                onclick="document.getElementById('new-key-dialog').close()">Cancel</button>
      </footer>
    </form>
  </article>
</dialog>

<!-- Fields editor dialog -->
<dialog id="fields-dialog">
  <article style="min-width:480px; max-width:640px">
    <header>
      <button aria-label="Close" rel="prev"
              onclick="document.getElementById('fields-dialog').close()"></button>
      <h3 style="margin:0">Custom Fields</h3>
    </header>
    <div id="fields-dialog-body"><p aria-busy="true">Loading…</p></div>
  </article>
</dialog>

{% endblock %}
